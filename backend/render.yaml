services:
  - type: web
    name: wildshield-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wildshield-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_CONFIDENCE_THRESHOLD
        value: "0.6"
      - key: DEFAULT_COOLDOWN_SECONDS
        value: "90"
      - key: DEFAULT_SIREN_DURATION_SECONDS
        value: "45"

databases:
  - name: wildshield-db
    plan: free
