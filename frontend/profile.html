<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildShield AI | Operator Profile</title>
    <meta name="description" content="Manage forest officer profile details, regional assignments, and credentials." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-panel">
        <main class="dashboard-grid profile-page">
          <section class="glass-card panel-card profile-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Account</p>
                <h3>Profile details</h3>
              </div>
              <button class="btn btn-primary" data-role="edit-profile-btn">Edit profile</button>
            </div>

            <div class="profile-grid">
              <div class="profile-summary glass-card">
                <div class="profile-avatar">FO</div>
                <div>
                  <h3>Forest Officer</h3>
                  <p class="muted">Lead operator</p>
                </div>
              </div>

              <div class="profile-fields">
                <div class="field-group">
                  <label for="profileName">Name</label>
                  <input id="profileName" type="text" value="Forest Officer" readonly />
                </div>
                <div class="field-group">
                  <label for="profileRole">Role</label>
                  <input id="profileRole" type="text" value="Lead operator" readonly />
                </div>
                <div class="field-group">
                  <label for="profileEmail">Email</label>
                  <input id="profileEmail" type="email" value="officer@wildshield.ai" readonly />
                </div>
                <div class="field-group">
                  <label for="profileLocation">Location</label>
                  <input id="profileLocation" type="text" value="Central Forest Command" readonly />
                </div>
              </div>
            </div>
          </section>

          <section class="glass-card panel-card security-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Security</p>
                <h3>Login & device protection</h3>
              </div>
            </div>
            <div class="security-grid">
              <div class="security-tile">
                <p>Two-step verification</p>
                <strong data-role="profile-2fa-status">Enabled</strong>
              </div>
              <div class="security-tile">
                <p>Last sign-in</p>
                <strong data-role="profile-last-login">--</strong>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="layout.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
  </body>
</html>
