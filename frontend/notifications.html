<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildShield AI | Notifications</title>
    <meta name="description" content="View all WildShield notifications." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-panel">

        <main class="dashboard-grid notifications-page">
          <section class="glass-card panel-card notifications-panel">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Notifications</p>
                <h3>All Alerts</h3>
              </div>
              <button class="btn btn-outline btn-sm" id="markAllReadBtn">Mark all as read</button>
            </div>
            <div class="notifications-list" data-role="notifications-list">
              <p>Loading notifications…</p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="layout.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
  </body>
</html>
