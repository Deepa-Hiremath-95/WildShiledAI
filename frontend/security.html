<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildShield AI | Security Settings</title>
    <meta name="description" content="Configure two-factor verification, view authorized devices, and monitor access protection audit events." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-panel">
        <main class="dashboard-grid security-page">
          <section class="glass-card panel-card security-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Access</p>
                <h3>Security settings</h3>
              </div>
            </div>
            <div class="security-grid">
              <div class="security-tile">
                <div>
                  <p>Two-step verification</p>
                  <strong data-role="two-factor-status" class="status-pill online">Enabled</strong>
                </div>
                <button class="btn btn-outline btn-sm" data-role="two-factor-toggle-btn" style="margin-top: 10px;">Toggle 2FA</button>
              </div>
              <div class="security-tile">
                <p>Authorized devices</p>
                <strong data-role="devices-count">1 active</strong>
              </div>
              <div class="security-tile">
                <p>Last sign-in</p>
                <strong data-role="last-login-time">--</strong>
              </div>
            </div>
          </section>

          <section class="glass-card panel-card security-panel">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Audit</p>
                <h3>Account protection events</h3>
              </div>
            </div>
            <div class="alert-matrix" data-role="security-events">
              <div class="alert-item">
                <p>Recent login</p>
                <strong>Just now</strong>
              </div>
              <div class="alert-item">
                <p>Device verification</p>
                <strong>Approved</strong>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="layout.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
  </body>
</html>
