<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildShield AI | Alerts & Incident Management</title>
    <meta name="description" content="Real-time incident management, human-wildlife conflict alerts, and emergency response dispatch." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-panel">

        <main class="dashboard-grid alerts-page">
          <section class="glass-card panel-card filter-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Alert stream</p>
                <h3>Active alert filters</h3>
              </div>
            </div>
            <div class="filter-buttons">
              <button class="filter-btn active">All</button>
              <button class="filter-btn">Low</button>
              <button class="filter-btn">Medium</button>
              <button class="filter-btn">High</button>
              <button class="filter-btn">Critical</button>
              <button class="filter-btn">Active</button>
              <button class="filter-btn">Resolved</button>
            </div>
          </section>

          <section class="alerts-list" data-role="alert-list"></section>
        </main>
      </div>
    </div>

    <script src="layout.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
  </body>
</html>
